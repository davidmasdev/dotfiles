unbind C-b
set -g prefix C-a
bind-key C-a last-window
bind-key e send-prefix

set -g status-position bottom
# set -g status-bg colour234  (psmux: unknown option; status-style below covers it)
# set -g status-fg colour137  (psmux: unknown option; status-style below covers it)
# psmux: status-bg/status-fg do not update status-style, so set it explicitly
# Naysayer theme colors (matches Alacritty)
set -g status-style bg=#062329,fg=#d1b897
set -g status-left ''
set -g status-right '#[fg=#126367]%d/%m #[fg=#44b340]%H:%M:%S '
set -g pane-border-style fg=#126367
set -g pane-active-border-style fg=#44b340
set -g message-style bg=#0b3335,fg=#8cde94
set -g message-command-style bg=#0b3335,fg=#8cde94
set -g mode-style bg=#0000ff,fg=#ffffff
set -g status-right-length 50
set -g status-left-length 20
setw -g mode-keys vi

setw -g window-status-current-style bg=#0b3335,fg=#8cde94,bold
setw -g window-status-style bg=#062329,fg=#d1b897
setw -g window-status-current-format ' #I#[fg=#44b340]:#[fg=#8cde94]#W#[fg=#44b340]#F '
setw -g window-status-format ' #I#[fg=#126367]:#[fg=#d1b897]#W#[fg=#126367]#F '

set-option -g history-limit 5000
# set -g extended-keys on  (psmux: unknown option)

# Use Git Bash (MINGW64) for new panes and windows
set -g default-shell "C:/Program Files/Git/usr/bin/bash.exe"
set-environment -g MSYSTEM MINGW64
set-environment -g CHERE_INVOKING 1

# Vim-style pane navigation (in addition to the default prefix + arrows)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Open new windows and splits in the current pane's folder
bind-key c new-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"

# Number windows and panes starting at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
